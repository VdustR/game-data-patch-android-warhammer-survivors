name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version-or-release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@v5.2.7
        with:
          version: 2026.11.4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Require verified current main
        id: source
        run: node scripts/verified-main.ts
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        if: steps.source.outputs.verified == 'true'
        id: changesets
        with:
          version-script: pnpm version-packages
          pr-title: "chore: release save patcher"
          commit-message: "chore: version save patcher"
          pr-draft: create
      - name: Run CI for the version pull request
        if: steps.source.outputs.verified == 'true' && steps.changesets.outputs.pr-number != ''
        run: gh workflow run ci.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish standalone tools
        if: steps.source.outputs.verified == 'true' && steps.changesets.outputs.has-changesets == 'false'
        run: pnpm build && pnpm release
        env:
          GH_TOKEN: ${{ github.token }}
