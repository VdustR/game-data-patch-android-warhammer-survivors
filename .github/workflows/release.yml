name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version-or-release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Require the current main revision
        if: github.event_name == 'workflow_run'
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
      - uses: jdx/mise-action@v3
        with:
          version: 2026.11.4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          version-script: pnpm version-packages
          pr-title: "chore: release save patcher"
          commit-message: "chore: version save patcher"
          pr-draft: create
      - name: Run CI for the version pull request
        if: steps.changesets.outputs.pr-number != ''
        run: gh workflow run ci.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish standalone tools
        if: steps.changesets.outputs.has-changesets == 'false'
        run: pnpm build && pnpm release
        env:
          GH_TOKEN: ${{ github.token }}
